[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=modules --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["modules"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py314']

[tool.isort]
profile = "black"
line_length = 88